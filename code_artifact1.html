      const textEl = document.getElementById('toastText');
      if (!banner || !textEl) return;
      textEl.textContent = message;
      banner.classList.remove('hidden');
      if (state.toastTimer) clearTimeout(state.toastTimer);
      state.toastTimer = setTimeout(() => {
        hideToast();
      }, 3600);
    }

    function hideToast() {
      const banner = document.getElementById('toastBanner');
      if (banner) banner.classList.add('hidden');
    }

    function navigateTo(targetView) {
      if (targetView === 'report') {
        const unanswered = getUnansweredIds();
        if (unanswered.length > 0) {
          showToast(`还有 ${unanswered.length} 题未作答（如第 ${unanswered[0]} 题），完成后即可生成我的心动报告`);
          state.view = 'quiz';
          if (state.quizMode === 'single') {
            const idx = QUESTIONS.findIndex((q) => q.id === unanswered[0]);
            if (idx >= 0) state.currentIndex = idx;
          }
          render();
          scrollToQuestion(unanswered[0]);
          return;
        }
      }
      state.view = targetView;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function startTest() {
      state.view = 'quiz';
      const unanswered = getUnansweredIds();
      if (unanswered.length > 0 && unanswered.length < QUESTIONS.length) {
        const idx = QUESTIONS.findIndex((q) => q.id === unanswered[0]);
        if (idx >= 0) state.currentIndex = idx;
      }
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function getUnansweredIds() {
      return QUESTIONS.filter((q) => !state.answers[q.id]).map((q) => q.id);
    }

    function selectAnswer(questionId, score) {
      state.answers[questionId] = score;

      if (state.view === 'quiz' && state.quizMode === 'single') {
        const idx = QUESTIONS.findIndex((q) => q.id === questionId);
        if (idx >= 0 && idx < QUESTIONS.length - 1) {
          state.currentIndex = idx + 1;
        }
      }
      render();
    }

    function setQuizMode(mode) {
      state.quizMode = mode;
      render();
    }

    function goToStep(index) {
      if (index < 0 || index >= QUESTIONS.length) return;
      state.currentIndex = index;
      render();
    }

    function jumpToFirstUnanswered() {
      const unanswered = getUnansweredIds();
      if (unanswered.length === 0) {
        showToast('全部 20 题均已完成作答，可点击“生成我的心动报告”');
        return;
      }
      const firstId = unanswered[0];
      if (state.quizMode === 'single') {
        const idx = QUESTIONS.findIndex((q) => q.id === firstId);
        if (idx >= 0) state.currentIndex = idx;
      }
      render();
      scrollToQuestion(firstId);
      showToast(`已定位到第 ${firstId} 题（共剩 ${unanswered.length} 题未答）`);
    }

    function submitQuiz() {
      const unanswered = getUnansweredIds();
      if (unanswered.length > 0) {
        showToast(`还有 ${unanswered.length} 题未选择（首个未答：第 ${unanswered[0]} 题）`);
        if (state.quizMode === 'single') {
          const idx = QUESTIONS.findIndex((q) => q.id === unanswered[0]);
          if (idx >= 0) state.currentIndex = idx;
        }
        render();
        scrollToQuestion(unanswered[0]);
        return;
      }
      state.view = 'report';
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function scrollToQuestion(qId) {
      setTimeout(() => {
        const el = document.getElementById(`q-card-${qId}`);
        if (el) {
          el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }, 60);
    }

    function retakeQuiz() {
      state.answers = {};
      state.currentIndex = 0;
      state.view = 'intro';
      showToast('已清空本次作答，可重新开始测试');
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetAllData() {
      state.view = 'intro';
      state.quizMode = 'single';
      state.currentIndex = 0;
      state.answers = {};
      showToast('已重置为初始状态');
      render();
    }

    /**
     * 严格按照计分与定型规则计算结果：
     * - M1 = 1~5题之和（5~20分）；M2 = 6~10题之和（5~20分）；M3 = 11~15题之和（5~20分）；M4 = 16~20题之和（5~20分）。
     * - F_filter = M1 + M2 + M3（15~60分）；R_real = M4（5~20分）。
     * - 找出 M1, M2, M3 中的最高分维度（若并列，优先按 M1 > M2 > M3 排序，并在报告中标注“双核叠加”提示）。
     * - 若 F_filter >= 40 且最高维为 M1 或 M3 -> 【浪漫滤镜投射型】；状态标签根据 F_filter 细分（>=50 为“高滤镜上头期”，44~49 为“理想化投射期”，40~43 为“落差觉察期”）。
     * - 若 F_filter >= 40 且最高维为 M2 -> 【情绪上头寄托型】；状态标签根据 F_filter 细分（>=50 为“高情绪波动期”，44~49 为“寄托牵引期”，40~43 为“敏感升温期”）。
     * - 若 F_filter <= 26 且 R_real >= 14 -> 【真实看见靠近型】；状态标签根据 R_real 细分（>=18 为“清醒心动期”，16~17 为“真实了解期”，14~15 为“平稳靠近期”）。
     * - 其余情况（包括 27 <= F_filter <= 39 或边界交叉区） -> 【心动摇摆观察型】；状态标签根据 F_filter 细分（>=35 为“好感观望期”，30~34 为“摇摆权衡期”，<=29 为“慢慢靠近期”）。
     */
    function calculateScores() {
      const dimScores = { M1: 0, M2: 0, M3: 0, M4: 0 };
      QUESTIONS.forEach((q) => {
        const val = state.answers[q.id] || 0;
        dimScores[q.dim] += val;
      });

      const F_filter = dimScores.M1 + dimScores.M2 + dimScores.M3;
      const R_real = dimScores.M4;

      // 在 M1, M2, M3 中按 M1 > M2 > M3 优先级寻找最高分维度
      const filterPriority = ['M1', 'M2', 'M3'];
      let maxFilterDimScore = -1;
      let topFilterDim = 'M1';

      filterPriority.forEach((dimKey) => {
        const sc = dimScores[dimKey];
        if (sc > maxFilterDimScore) {
          maxFilterDimScore = sc;
          topFilterDim = dimKey;
        }
      });

      const tiedFilterDims = ['M1', 'M2', 'M3'].filter((d) => dimScores[d] === maxFilterDimScore);
      const isDualCore = F_filter >= 40 && tiedFilterDims.length > 1;
      const tiedNames = tiedFilterDims.map((d) => `${DIMENSIONS[d].name}（${d}）`).join('、');

      let matchedTypeKey = 'TYPE_3';
      let statusLabel = '摇摆权衡期';

      if (F_filter >= 40 && (topFilterDim === 'M1' || topFilterDim === 'M3')) {
        matchedTypeKey = 'TYPE_1';
        if (F_filter >= 50) {
          statusLabel = '高滤镜上头期';
        } else if (F_filter >= 44) {
          statusLabel = '理想化投射期';
        } else {
          statusLabel = '落差觉察期';
        }
      } else if (F_filter >= 40 && topFilterDim === 'M2') {
        matchedTypeKey = 'TYPE_2';
        if (F_filter >= 50) {
          statusLabel = '高情绪波动期';
        } else if (F_filter >= 44) {
          statusLabel = '寄托牵引期';
        } else {
          statusLabel = '敏感升温期';
        }
      } else if (F_filter <= 26 && R_real >= 14) {
        matchedTypeKey = 'TYPE_4';
        if (R_real >= 18) {
          statusLabel = '清醒心动期';
        } else if (R_real >= 16) {
          statusLabel = '真实了解期';
        } else {
          statusLabel = '平稳靠近期';
        }
      } else {
        matchedTypeKey = 'TYPE_3';
        if (F_filter >= 35) {
          statusLabel = '好感观望期';
        } else if (F_filter >= 30) {
          statusLabel = '摇摆权衡期';
        } else {
          statusLabel = '慢慢靠近期';
        }
      }

      return {
        dimScores,
        F_filter,
        R_real,
        topFilterDim,
        maxFilterDimScore,
        isDualCore,
        tiedNames,
        matchedTypeKey,
        statusLabel,
      };
    }

    function getDimLevelInfo(dimKey, score, res) {
      if (dimKey === 'M4') {
        if (score >= 16) {
          return {
            tag: '核心优势维度',
            badge: 'bg-sageSoft text-sageAccent border border-[#D4E6DF]',
          };
        }
        if (score >= 12) {
          return {
            tag: '真实感稳健',
            badge: 'bg-sageSoft text-sageAccent',
          };
        }
        return {
          tag: '清醒度待充能',
          badge: 'bg-apricotSoft text-apricotAccent',
        };
      }

      const isPrimarySource = dimKey === res.topFilterDim && res.F_filter >= 27;
      if (isPrimarySource && score >= 14) {
        return {
          tag: '主要投射源',
          badge: 'bg-pinkSoft text-coralPink border border-pinkBorder',
        };
      }
      if (score >= 15) {
        return {
          tag: '高投射波动',
          badge: 'bg-pinkSoft text-coralPink',
        };
      }
      if (score >= 10) {
        return {
          tag: '中度期待感',
          badge: 'bg-lilacSoft text-lilacAccent',
        };
      }
      return {
        tag: '相对理性',
        badge: 'bg-sageSoft text-sageAccent',
      };
    }

    function copyReportSummary() {
      try {
        const res = calculateScores();
        const report = REPORT_TYPES[res.matchedTypeKey];
        const summaryLines = [
          '【心动觉察测评报告】',
          '测评主题：《你现在的心动，是“看见真实的人”，还是“滤镜与投射”？》',
          `心动主类型：${report.typeName}（${res.statusLabel}）`,
          `核心指标：滤镜投射指数 ${res.F_filter}/60 分 ｜ 真实看见指数 ${res.R_real}/20 分`,
          `四维得分：M1=${res.dimScores.M1}/20 · M2=${res.dimScores.M2}/20 · M3=${res.dimScores.M3}/20 · M4=${res.dimScores.M4}/20`,
          `核心定调：${report.coreTone}`,
          `专属建议：1.${report.suggestions[0].title}；2.${report.suggestions[1].title}；3.${report.suggestions[2].title}`,
        ];
        const textToCopy = summaryLines.join('\n');

        const helper = document.getElementById('clipboardHelper');
        if (!helper) {
          showToast('暂无法访问剪贴板，请手动截图保存报告');
          return;
        }
        helper.value = textToCopy;
        helper.classList.remove('sr-only');
        helper.select();
        helper.setSelectionRange(0, textToCopy.length);
        const ok = document.execCommand('copy');
        helper.classList.add('sr-only');

        if (ok) {
          showToast('已复制心动报告摘要，可直接粘贴保存或分享');
        } else {
          showToast('复制未成功，建议直接长按或截图保存当前报告页');
        }
      } catch (err) {
        showToast('复制遇到小状况，建议直接截图保存当前报告页');
      }
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

              <div class="space-y-3 pt-1">
                <div class="sticky top-[52px] z-10 bg-creamCard/95 backdrop-blur py-2 px-3 rounded-xl border border-[#EFE5E7]">
                  <span class="text-xs font-bold text-ink">${escapeHtml(group.dim.fullTitle)}</span>
                </div>
                ${group.items
                  .map((q) => {
                    const selectedScore = state.answers[q.id];
                    return `
                      <div id="q-card-${q.id}" class="rounded-2xl bg-white p-4 border border-[#EFE5E7] shadow-card">
                        <h3 class="text-sm font-semibold text-ink leading-relaxed">
                          ${q.id}. ${escapeHtml(q.text)}
                        </h3>
                        <div class="mt-2.5 grid grid-cols-1 gap-1.5">
                          ${OPTIONS.map((opt) => {
                            const isSelected = selectedScore === opt.score;
                            return `
                              <button
                                type="button"
                                onclick="selectAnswer(${q.id}, ${opt.score})"
                                aria-pressed="${isSelected}"
                                class="w-full text-left px-3 py-2.5 rounded-xl border text-xs transition flex items-center justify-between gap-2 ${
                                  isSelected
                                    ? 'bg-pinkSoft border-coralPink text-ink font-semibold'
                                    : 'bg-white border-[#EFE5E7] text-ink hover:border-mistPink'
                                }"
                              >
                                <span>${escapeHtml(opt.label)}</span>
                                <span class="text-[11px] font-semibold ${isSelected ? 'text-coralPink' : 'text-inkMuted'}">
                                  ${isSelected ? '已选' : opt.key}
                                </span>
                              </button>
                            `;
                          }).join('')}
                        </div>
                      </div>
                    `;
                  })
                  .join('')}
              </div>
            `
              )
              .join('')}

            <div class="flex gap-2 pt-2">
              ${
                unansweredCount > 0
                  ? `
                <button
                  type="button"
                  onclick="jumpToFirstUnanswered()"
                  class="py-3.5 px-3.5 rounded-2xl border border-pinkBorder bg-pinkSoft text-coralPink text-xs font-semibold"
                >
                  跳转未答题
                </button>
              `
                  : ''
              }
              <button
                type="button"
                onclick="submitQuiz()"
                class="flex-1 py-3.5 px-4 rounded-2xl bg-coralPink text-white text-sm font-semibold hover:bg-[#C96B7D] transition shadow-sm"
              >
                生成我的心动报告（${answeredCount}/20）
              </button>
            </div>
          `
          }
        </section>
      `;
    }

    function renderReportView() {
      const res = calculateScores();
      const report = REPORT_TYPES[res.matchedTypeKey];

      return `
        <section class="space-y-4 fade-in">
          <!-- 顶部结果徽章卡 -->
          <div class="rounded-[26px] bg-gradient-to-br from-[#FBEFF2] via-[#FFFDFB] to-[#FDF3EC] p-5 border border-[#F2DCE1] shadow-card space-y-3.5">
            <div class="flex items-center justify-between gap-2 flex-wrap">
              <span class="text-xs px-3 py-1 rounded-full bg-white text-coralPink font-semibold border border-pinkBorder">
                专属心动分析报告
              </span>
              <div class="flex items-center gap-1.5 flex-wrap">
                ${
                  res.isDualCore
                    ? `<span class="text-[11px] px-2.5 py-0.5 rounded-full bg-lilacSoft text-lilacAccent font-semibold border border-[#E2D9EE]">双核叠加</span>`
                    : ''
                }
                <span class="text-[11px] px-2.5 py-0.5 rounded-full bg-apricotSoft text-apricotAccent font-semibold border border-[#F3DEC9]">
                  ${escapeHtml(res.statusLabel)}
                </span>
              </div>
            </div>

            <div>
              <div class="text-xs text-inkMuted">心动主类型</div>
              <h2 class="text-xl font-bold text-ink mt-0.5">
                ${escapeHtml(report.typeName)}
              </h2>
              <p class="text-xs text-coralPink font-medium mt-0.5">${escapeHtml(report.tagDesc)}</p>
              ${
                res.isDualCore
                  ? `<p class="text-[11px] text-lilacAccent mt-1.5 leading-relaxed bg-white/80 px-2.5 py-1.5 rounded-xl border border-[#E7DFF2]">
                      双核叠加提示：最高投射维度并列为 ${escapeHtml(res.tiedNames)}，已按优先级（M1 &gt; M2 &gt; M3）判定主类型。
                    </p>`
                  : ''
              }
            </div>

            <!-- 双核心指标卡片 -->
            <div class="grid grid-cols-2 gap-2.5 pt-0.5">
              <div class="rounded-2xl bg-white/95 p-3 border border-[#F2E3E6]">
                <div class="text-[11px] text-inkMuted">滤镜投射指数（M1+M2+M3）</div>
                <div class="text-base font-bold text-ink mt-0.5">${res.F_filter} / 60 分</div>
                <div class="text-[11px] text-coralPink font-medium mt-0.5">
                  ${res.F_filter >= 40 ? '滤镜投射偏高' : res.F_filter <= 26 ? '滤镜投射较低' : '中等波动区间'}
                </div>
              </div>
              <div class="rounded-2xl bg-white/95 p-3 border border-[#E3EDE9]">
                <div class="text-[11px] text-inkMuted">真实看见指数（M4）</div>
                <div class="text-base font-bold text-ink mt-0.5">${res.R_real} / 20 分</div>
                <div class="text-[11px] text-sageAccent font-medium mt-0.5">
                  ${res.R_real >= 14 ? '真实看见稳健' : '真实感待加深'}
                </div>
              </div>
            </div>
          </div>

          <!-- 一、核心画像定调 -->
          <div class="rounded-2xl bg-white p-4 border border-[#EFE5E7] shadow-card space-y-2">
            <h3 class="text-sm font-bold text-ink flex items-center gap-2">
              <span class="w-2 h-2 rounded-full bg-coralPink"></span>
              一、 核心画像定调
            </h3>
            <p class="text-[13px] text-ink leading-relaxed">
              ${escapeHtml(report.coreTone)}
            </p>
          </div>

          <!-- 二、4 维心动图谱 -->
          <div class="rounded-2xl bg-white p-4 border border-[#EFE5E7] shadow-card space-y-3.5">
            <h3 class="text-sm font-bold text-ink flex items-center gap-2">
              <span class="w-2 h-2 rounded-full bg-apricotAccent"></span>
              二、 4 维心动图谱
            </h3>

            <div class="space-y-3">
              ${['M1', 'M2', 'M3', 'M4']
                .map((dimKey) => {
                  const dim = DIMENSIONS[dimKey];
                  const score = res.dimScores[dimKey];
                  const pct = Math.round((score / 20) * 100);
                  const levelInfo = getDimLevelInfo(dimKey, score, res);
                  return `
                    <div class="rounded-2xl bg-cream p-3 border border-[#F0E7E9] space-y-1.5">
                      <div class="flex items-center justify-between gap-2">
                        <span class="text-xs font-semibold text-ink">
                          ${escapeHtml(dim.name)}（${dim.id}）
                        </span>
                        <div class="flex items-center gap-1.5 shrink-0">
                          <span class="text-[11px] px-2 py-0.5 rounded-full font-medium ${levelInfo.badge}">
                            ${escapeHtml(levelInfo.tag)}
                          </span>
                          <span class="text-xs font-bold text-ink">${score} / 20 分</span>
                        </div>
                      </div>
                      <div class="w-full h-2.5 rounded-full bg-[#ECE0E3] overflow-hidden">
                        <div class="h-full rounded-full ${dim.barClass} bar-fill" style="width: ${pct}%"></div>
                      </div>
                      <p class="text-[11px] text-inkMuted leading-normal">
                        ${escapeHtml(dim.shortDesc)}
                      </p>
                    </div>
                  `;
                })
                .join('')}
            </div>
          </div>

          <!-- 三、2 个高频触发场景 -->
          <div class="rounded-2xl bg-white p-4 border border-[#EFE5E7] shadow-card space-y-3">
            <h3 class="text-sm font-bold text-ink flex items-center gap-2">
              <span class="w-2 h-2 rounded-full bg-mistPink"></span>
              三、 2 个高频触发场景
            </h3>
            <div class="space-y-2.5">
              ${report.scenarios
                .map(
                  (sc, idx) => `
                <div class="rounded-2xl bg-cream p-3.5 border border-[#F0E7E9] space-y-1">
                  <div class="text-xs font-bold text-ink">${idx + 1}. ${escapeHtml(sc.title)}</div>
                  <p class="text-xs text-inkMuted leading-relaxed">${escapeHtml(sc.desc)}</p>
                </div>
              `
                )
                .join('')}
            </div>
          </div>

          <!-- 四、2 个容易忽略的隐形盲点 -->
          <div class="rounded-2xl bg-white p-4 border border-[#EFE5E7] shadow-card space-y-3">
            <h3 class="text-sm font-bold text-ink flex items-center gap-2">
              <span class="w-2 h-2 rounded-full bg-lilacAccent"></span>
              四、 2 个容易忽略的隐形盲点
            </h3>
            <div class="space-y-2.5">
              ${report.blindSpots
                .map(
                  (bs, idx) => `
                <div class="rounded-2xl bg-lilacSoft/65 p-3.5 border border-[#E5DDF0] space-y-1">
                  <div class="text-xs font-bold text-ink">${idx + 1}. ${escapeHtml(bs.title)}</div>
                  <p class="text-xs text-inkMuted leading-relaxed">${escapeHtml(bs.desc)}</p>
                </div>
              `
                )
                .join('')}
            </div>
          </div>

          <!-- 五、3 条低成本止损与回血建议 -->
          <div class="rounded-2xl bg-white p-4 border border-[#EFE5E7] shadow-card space-y-3">
            <h3 class="text-sm font-bold text-ink flex items-center gap-2">
              <span class="w-2 h-2 rounded-full bg-sageAccent"></span>
              五、 3 条低成本止损与回血建议
            </h3>
            <div class="space-y-2.5">
              ${report.suggestions
                .map(
                  (sg, idx) => `
                <div class="rounded-2xl bg-sageSoft/70 p-3.5 border border-[#D8E7E1] space-y-1">
                  <div class="text-xs font-bold text-ink">${idx + 1}. ${escapeHtml(sg.title)}</div>
                  <p class="text-xs text-inkMuted leading-relaxed">${escapeHtml(sg.desc)}</p>
                </div>
              `
                )
                .join('')}
            </div>
          </div>

          <!-- 底部操作按钮 -->
          <div class="flex gap-2.5 pt-1">
            <button
              type="button"
              onclick="copyReportSummary()"
              class="flex-1 py-3.5 px-3.5 rounded-2xl bg-pinkSoft text-coralPink border border-pinkBorder text-xs font-semibold hover:bg-mistPink hover:text-white transition"
            >
              保存/复制报告摘要
            </button>
            <button
              type="button"
              onclick="retakeQuiz()"
              class="flex-1 py-3.5 px-3.5 rounded-2xl bg-coralPink text-white text-xs font-semibold hover:bg-[#C96B7D] transition shadow-sm"
            >
              重新测试
            </button>
          </div>
        </section>
      `;
    }

    function render() {
      const mainEl = document.getElementById('mainContent');
      if (!mainEl) return;

      if (state.view === 'quiz') {
        mainEl.innerHTML = renderQuizView();
      } else if (state.view === 'report') {
        mainEl.innerHTML = renderReportView();
      } else {
        mainEl.innerHTML = renderIntroView();
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      try {
        render();
      } catch (err) {
        const mainEl = document.getElementById('mainContent');
        if (mainEl) {
          mainEl.innerHTML = `
            <div class="rounded-2xl bg-pinkSoft p-4 text-xs text-ink">
              页面渲染遇到小状况，请点击底部“重置进度”恢复。
            </div>
          `;
        }
      }
    });
  </script>
</body>
</html>
