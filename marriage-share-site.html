<style>
:root{--bg:#faf6f6;--ink:#292326;--muted:#766a6c;--pink:#ae5978;--pink2:#c7839b;--soft:#f4e8eb;--gold:#b39369;--line:#eadfe3;--white:#fff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;padding:22px 15px 40px}.wrap{width:min(100%,680px);margin:auto;min-height:calc(100vh - 62px);display:flex;flex-direction:column}.progress{height:7px;border-radius:20px;background:var(--line);overflow:hidden;margin:4px 0 28px}.progress>i{display:block;width:0;height:100%;background:var(--pink);transition:width .25s}.screen{flex:1;display:flex;flex-direction:column;justify-content:center}.hide{display:none!important}.eyebrow{text-align:center;color:var(--gold);font-weight:800;letter-spacing:3px;font-size:14px;margin-bottom:22px}h1{font-size:clamp(36px,8vw,58px);line-height:1.25;text-align:center;margin:0 0 18px;font-weight:900;letter-spacing:-1.5px}h1 em{font-style:normal;color:var(--pink)}.subtitle{text-align:center;color:var(--muted);font-size:18px;margin:0 0 30px}.heart{font-size:72px;text-align:center;color:var(--pink2);margin:5px 0 25px;text-shadow:0 10px 20px #d8b8c455}.btn{border:0;background:var(--pink);color:white;border-radius:999px;padding:16px 28px;font-size:19px;font-weight:800;box-shadow:0 10px 22px #ae597833;cursor:pointer;min-height:54px}.btn:disabled{opacity:.4;cursor:not-allowed}.btn.alt{background:white;color:var(--pink);border:1px solid var(--line);box-shadow:none}.btnrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:24px}.tip{text-align:center;color:var(--gold);font-weight:700;margin-top:44px}.qhead{display:flex;justify-content:space-between;color:var(--gold);font-size:14px;font-weight:800;letter-spacing:1px;margin-bottom:20px}.qhead b{color:var(--pink)}.question{font-size:clamp(26px,5.5vw,38px);line-height:1.45;font-weight:900;margin:0 0 25px}.opts{display:grid;gap:12px}.opt{display:flex;align-items:center;gap:14px;text-align:left;border:1.5px solid #f0e9ea;background:#fff;border-radius:17px;padding:16px;min-height:72px;color:var(--ink);font-size:18px;font-weight:700;cursor:pointer;box-shadow:0 5px 16px #49333b08}.opt.sel{background:#f8edf1;border:2px solid var(--pink);padding:15.5px}.letter{width:37px;height:37px;flex:0 0 37px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--pink);font-weight:900}.sel .letter{background:var(--pink);color:#fff}.tick{margin-left:auto;color:var(--pink);font-size:21px}.result{text-align:center}.result .heart{margin:0 0 8px}.result h2{font-size:clamp(34px,7vw,48px);color:var(--pink);margin:7px 0 10px}.rsub{font-size:19px;font-weight:800;line-height:1.55;margin:0 0 16px}.desc{font-size:16px;line-height:1.9;color:var(--muted);margin:0 auto 18px;max-width:560px}.panel{background:#f3e7ea;border-radius:18px;padding:19px;text-align:left;margin:13px 0}.panel h3{margin:0 0 11px;color:var(--pink);font-size:17px}.traits{list-style:none;padding:0;margin:0;display:grid;gap:9px;color:#51454a}.traits li:before{content:'♥';color:var(--pink);margin-right:9px}.bars{display:grid;gap:12px;text-align:left;margin:17px 0}.barlabel{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-bottom:5px}.track{height:8px;background:var(--line);border-radius:20px;overflow:hidden}.fill{height:100%;background:var(--pink)}.sharebox{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px;margin-top:18px}.sharebox h3{margin:0 0 8px;color:var(--pink)}.sharebox p{color:var(--muted);font-size:13px;line-height:1.7;margin:0 0 13px}.smallnote{font-size:12px;color:#9a888b;line-height:1.7;margin:16px auto}.footer{text-align:center;color:#b09da2;font-size:12px;margin-top:24px}

<body><main class="wrap"><div class="progress"><i id="progress"></i></div>
<section class="screen" id="home"><div class="eyebrow">— 婚 姻 选 择 测 试 —</div><h1>你最终会<em>嫁给</em><br>什么人？</h1><p class="subtitle">5道题 · 看清你真正想要的那个人</p><div class="heart">♡</div><button class="btn" id="start">开始测试</button><p class="tip">凭第一直觉选，别多想</p></section>
<section class="screen hide" id="quiz"><div class="qhead"><span id="qnum">QUESTION 01 / 05</span><b id="counter">1 / 5</b></div><h2 class="question" id="qtext"></h2><div class="opts" id="opts"></div><div class="btnrow"><button class="btn alt" id="back">上一题</button><button class="btn" id="next" disabled>下一题</button></div></section>
<section class="screen hide result" id="result"><div class="eyebrow">YOUR MARRIAGE PROFILE</div><div class="heart">♡</div><div>你的理想婚姻伴侣是</div><h2 id="rname"></h2><p class="rsub" id="rsub"></p><p class="desc" id="desc"></p><div class="panel"><h3>你的理想伴侣特征</h3><ul class="traits" id="traits"></ul></div><div class="panel"><h3>给你的婚姻建议</h3><div id="advice" style="line-height:1.8;color:#66565b"></div></div><h3 style="color:var(--pink);margin:12px 0 0">你的选择倾向</h3><div class="bars" id="bars"></div>
<div class="sharebox"><h3>把你的测试结果分享出去</h3><p>生成专属结果海报。好友可以看到你的结果，也能重新测试自己的类型。</p><div class="btnrow" style="margin:0"><button class="btn" id="share">分享结果</button><button class="btn alt" id="poster">生成分享海报</button></div><p id="sharehint" aria-live="polite" style="margin:10px 0 0"></p></div>
<p class="smallnote">测试仅供娱乐与自我探索，不代表真实婚姻预测。真正适合的人，需要在相处和行动中慢慢了解。</p><div class="btnrow"><button class="btn alt" id="again">我也想测一测</button></div></section><div class="footer">婚姻选择测试 · 凭第一直觉选，别多想</div></main>
<script>
const qs=[
{q:'第一次去他家吃饭，你最留意的是？',o:[['A','他怎么跟他妈说话','D'],['B','家里收拾得干不干净','B'],['C','他有没有主动搭把手','C'],['D','他有没有顾上你','A']]},
{q:'加班到很晚才回家，你最想听到哪句？',o:[['A','饭在锅里，我给你热','A'],['B','今天怎么这么晚','D'],['C','去洗澡吧，剩下的我来','C'],['D','什么也不用说，他在就行','D']]},
{q:'如果你们发生了争吵，你最希望他怎么做？',o:[['A','主动来哄我，给我一个拥抱','A'],['B','冷静下来，认真解决问题','B'],['C','不推卸责任，主动沟通','C'],['D','愿意听我倾诉，理解我的感受','D']]},
{q:'结婚以后，你认为最重要的是什么？',o:[['A','生活中处处有温暖和惊喜','A'],['B','经济稳定，生活有保障','B'],['C','两个人共同承担家庭责任','C'],['D','彼此理解，精神上互相陪伴','D']]},
{q:'如果未来遇到生活压力，你希望另一半是？',o:[['A','愿意为我制造快乐的人','A'],['B','踏实可靠，能给我安全感的人','B'],['C','和我并肩作战、共同承担的人','C'],['D','无论发生什么都坚定选择我的人','D']]}
];
const ps={
A:{name:'温柔体贴型',sub:'你最终想嫁给一个把爱融入生活的人',desc:'你看重的是日常生活里的温柔。他不一定要有多么浪漫，但会记得你的喜好，在你疲惫的时候给你关心，在平凡的日子里让你感受到被爱。',traits:['懂得表达爱意','愿意主动关心你','注重生活仪式感'],advice:'不要只看他说了多少甜言蜜语，更要看他的关心是否长期稳定。'},
B:{name:'成熟稳重型',sub:'你最终想嫁给一个让你安心的人',desc:'你希望婚姻是一份踏实的依靠。你欣赏有责任心、生活习惯良好、做事有规划的人。对你而言，稳定的生活和可靠的承诺比短暂的激情更重要。',traits:['生活习惯良好','有责任心和规划','经济与情绪相对稳定'],advice:'安全感很重要，但也别忽略两个人之间的情感交流。'},
C:{name:'责任担当型',sub:'你最终想嫁给一个真正的合伙人',desc:'你不想一个人承担婚姻里的所有责任。你希望对方能够主动分担家务、共同面对困难，在大事小事上都愿意与你并肩前行。',traits:['主动承担家庭责任','尊重平等的关系','遇事愿意共同解决'],advice:'观察他在实际行动中的担当，而不是只听他对未来的承诺。'},
D:{name:'灵魂陪伴型',sub:'你最终想嫁给一个真正懂你的人',desc:'你最看重的是精神上的契合。你希望有一个人能够理解你的情绪、尊重你的想法，在你需要的时候给予陪伴，让你在婚姻里依然可以做真实的自己。',traits:['善于倾听和沟通','尊重你的感受','愿意给予情绪支持'],advice:'真正的理解需要双向奔赴，也要看彼此能否在现实生活中磨合。'}
};
let idx=0,answers=Array(5).fill(null),counts=null,winner=null;const $=id=>document.getElementById(id);const screens=['home','quiz','result'];function show(s){screens.forEach(x=>$(x).classList.toggle('hide',x!==s))}
function render(){let q=qs[idx];$('qnum').textContent=`QUESTION 0${idx+1} / 05`;$('counter').textContent=`${idx+1} / 5`;$('qtext').textContent=q.q;$('progress').style.width=`${idx/5*100}%`;$('opts').innerHTML='';q.o.forEach((o,i)=>{let b=document.createElement('button');b.className='opt'+(answers[idx]===i?' sel':'');b.innerHTML=`<span class="letter">${o[0]}</span><span>${o[1]}</span>${answers[idx]===i?'<span class="tick">✓</span>':''}`;b.onclick=()=>{answers[idx]=i;render()};$('opts').appendChild(b)});$('back').style.visibility=idx===0?'hidden':'visible';$('next').disabled=answers[idx]===null;$('next').textContent=idx===4?'查看测试结果':'下一题'}
function makeResult(){counts={A:0,B:0,C:0,D:0};answers.forEach((a,i)=>counts[qs[i].o[a][2]]++);winner=['A','B','C','D'].reduce((a,b)=>counts[b]>counts[a]?b:a,'A');let p=ps[winner];$('rname').textContent=p.name;$('rsub').textContent=p.sub;$('desc').textContent=p.desc;$('advice').textContent=p.advice;$('traits').innerHTML=p.traits.map(x=>`<li>${x}</li>`).join('');$('bars').innerHTML=['A','B','C','D'].map(k=>`<div><div class="barlabel"><span>${ps[k].name}</span><b>${counts[k]}/5</b></div><div class="track"><div class="fill" style="width:${counts[k]*20}%"></div></div></div>`).join('');$('progress').style.width='100%';show('result');history.replaceState({},'',location.pathname+location.search+'#result')}
function resultURL(){let u=new URL(location.href);u.search='';u.hash='';u.searchParams.set('result',winner);u.searchParams.set('scores',['A','B','C','D'].map(k=>counts[k]).join('-'));return u.href}
function toast(t){$('sharehint').textContent=t}
$('start').onclick=()=>{idx=0;answers=Array(5).fill(null);history.replaceState({},'',location.pathname);show('quiz');render()};$('next').onclick=()=>{if(answers[idx]===null)return;if(idx<4){idx++;render()}else makeResult()};$('back').onclick=()=>{if(idx>0){idx--;render()}};$('again').onclick=()=>{$('start').click();window.scrollTo({top:0,behavior:'smooth'})};
$('copy').onclick=async()=>{let url=resultURL();try{await navigator.clipboard.writeText(url);toast('结果链接已复制，可以粘贴到微信或小红书。')}catch(e){toast('请手动复制此链接：'+url)}};
$('share').onclick=async()=>{let url=resultURL();let data={title:'我的婚姻选择测试结果：'+ps[winner].name,text:ps[winner].sub+'，你也来测测看！',url};if(navigator.share){try{await navigator.share(data);toast('已打开系统分享面板。')}catch(e){if(e.name!=='AbortError')toast('分享未完成，请复制链接分享。')}}else{try{await navigator.clipboard.writeText(url);toast('当前浏览器不支持直接分享，结果链接已复制。')}catch(e){toast('请点击“复制结果链接”后分享。')}}};
$('poster').onclick=()=>{let p=ps[winner],c=document.createElement('canvas');c.width=900;c.height=1200;let x=c.getContext('2d');let g=x.createLinearGradient(0,0,900,1200);g.addColorStop(0,'#fffafa');g.addColorStop(1,'#f4e8eb');x.fillStyle=g;x.fillRect(0,0,900,1200);x.fillStyle='#f1dfe5';x.beginPath();x.arc(850,80,180,0,Math.PI*2);x.fill();x.beginPath();x.arc(40,1120,150,0,Math.PI*2);x.fill();x.textAlign='center';x.fillStyle='#b39369';x.font='bold 30px sans-serif';x.fillText('— 婚 姻 选 择 测 试 —',450,155);x.fillStyle='#292326';x.font='bold 64px sans-serif';x.fillText('你最终会嫁给什么人？',450,285);x.fillStyle='#ae5978';x.font='bold 76px sans-serif';x.fillText(p.name,450,455);x.fillStyle='#594d51';x.font='bold 32px sans-serif';wrapText(x,p.sub,450,535,730,48);x.fillStyle='#766a6c';x.font='28px sans-serif';wrapText(x,p.desc,450,665,730,48);x.fillStyle='#b39369';x.font='bold 26px sans-serif';x.fillText('凭第一直觉选，测测你的理想伴侣类型',450,1015);x.fillStyle='#ae5978';x.font='bold 24px sans-serif';x.fillStyle='#9a888b';x.font='20px sans-serif';x.fillText('测试仅供娱乐与自我探索',450,1140);let a=document.createElement('a');a.download='我的婚姻选择测试结果.png';a.href=c.toDataURL('image/png');a.click();toast('海报已生成并下载。')};
function wrapText(ctx,text,cx,y,maxWidth,lineHeight){let line='',lines=[];for(let ch of text){let test=line+ch;if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=ch}else line=test}if(line)lines.push(line);lines.slice(0,4).forEach((l,i)=>ctx.fillText(l,cx,y+i*lineHeight))}
// Shared result deep link: ?result=A/B/C/D opens the corresponding result view.
const shared=new URLSearchParams(location.search).get('result');if(shared&&ps[shared]){winner=shared;counts={A:0,B:0,C:0,D:0};const scoreParam=(new URLSearchParams(location.search).get('scores')||'').split('-').map(Number);if(scoreParam.length===4&&scoreParam.every(n=>Number.isInteger(n)&&n>=0&&n<=5)&&scoreParam.reduce((a,b)=>a+b,0)===5){['A','B','C','D'].forEach((k,i)=>counts[k]=scoreParam[i]);}else{counts[shared]=5;}let p=ps[shared];$('rname').textContent=p.name;$('rsub').textContent=p.sub;$('desc').textContent=p.desc;$('advice').textContent=p.advice;$('traits').innerHTML=p.traits.map(x=>`<li>${x}</li>`).join('');$('bars').innerHTML=['A','B','C','D'].map(k=>`<div><div class="barlabel"><span>${ps[k].name}</span><b>${counts[k]}/5</b></div><div class="track"><div class="fill" style="width:${counts[k]*20}%"></div></div></div>`).join('');$('progress').style.width='100%';show('result');$('sharehint').textContent='这是好友分享的结果。你也可以重新测试，看看自己的类型。'}
</script></body></html>
